name: Check, Test, and Build

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version: [22.x]

    name: Node ${{ matrix.node_version }} Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: "pnpm"

      - name: Create Environment File
        run: |
          echo "BASEHUB_TOKEN=${{ secrets.BASEHUB_TOKEN }}" >> .env.local

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run BaseHub CLI
        run: pnpm run basehub

      - name: Run Biome Check
        run: pnpm run check

      - name: Run TypeScript Check
        run: pnpm run type-check

      - name: Run Jest Tests
        run: pnpm run test

      - name: Build with Next.js
        run: pnpm run build
        env:
          NODE_ENV: production
