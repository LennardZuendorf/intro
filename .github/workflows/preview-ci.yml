# Environment secrets only apply when `environment:` matches Settings → Environments.
# GitHub does NOT auto-pick Preview vs Production from the branch — we map PR → Preview,
# push to main / workflow_dispatch → Production (adjust names if yours differ).
# https://docs.github.com/en/actions/deployment/targeting-different-environments/managing-environments-for-deployment
#
# Fork PRs: secrets are not passed from forks (except GITHUB_TOKEN).

name: Check, Test, and Build

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}

    strategy:
      matrix:
        node_version: ["24.14.0"]

    name: Node ${{ matrix.node_version }} Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome Check
        run: pnpm run check

      - name: Run TypeScript Check
        run: pnpm run type-check

      - name: Run Jest Tests
        run: pnpm run test

      - name: Build with Next.js
        run: pnpm run build
        env:
          NODE_ENV: production
