name: Check, Test, and Build

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Single source for BaseHub + Next; must match package.json "engines.node"
    env:
      BASEHUB_TOKEN: ${{ secrets.BASEHUB_TOKEN }}

    strategy:
      matrix:
        node_version: ["24.14.0"]

    name: Node ${{ matrix.node_version }} Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require BASEHUB_TOKEN secret
        run: |
          if [ -z "$BASEHUB_TOKEN" ]; then
            echo "::error::BASEHUB_TOKEN is not set. Add it under GitHub → Settings → Secrets and variables → Actions → New repository secret (name: BASEHUB_TOKEN, value: your BaseHub API token)."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run BaseHub CLI
        run: pnpm run basehub

      - name: Run Biome Check
        run: pnpm run check

      - name: Run TypeScript Check
        run: pnpm run type-check

      - name: Run Jest Tests
        run: pnpm run test

      - name: Build with Next.js
        run: pnpm run build
        env:
          NODE_ENV: production
